# JUVAl — public identity surface (Phase 2 only).
#
# Install as /etc/nginx/sites-available/juval-fusionauth-public and symlink it
# into sites-enabled. Do NOT enable this until the Phase 2 decision in
# README.md is made — Phase 1 needs no proxy at all.
#
# This is an allow-list, not a filter. The default action is 404; only the
# endpoints the ADR-034 BFF actually needs are reachable. Adding a path here
# widens the public attack surface of the only host holding a copy of the
# repository, so each addition is a deliberate act with a named reason.
#
# NEVER add:  /admin     (FusionAuth administrative UI — ADR-035 Condition 2)
#             /api       (FusionAuth REST API — API-key protected, but there is
#                         no reason for it to be reachable from the internet)
#             /account   (self-service portal. Measured 2026-09-09: it answers
#                         200 on unlicensed Community, so it is a real
#                         password-adjacent surface, not an inert one —
#                         FUSIONAUTH_169_IDENTITY_LAB.md §9.5/§10)
#             /password  (forgot/change. See "The passwordChangeRequired
#                         tension" below — this is a deliberate exclusion with
#                         a known consequence, not an oversight)
#
# It listens on loopback because nothing dials it from the network: an
# outbound tunnel process on this host connects to it. No inbound port is
# opened, and no `ufw allow` rule accompanies this file (ADR-031 §"Frontera de
# red (Opción A)").
#
# ---------------------------------------------------------------------------
# Current route inventory — inactive candidate; ADR-041 is Proposed.
# Protocol exact routes: discovery, JWKS, authorize, token and logout.
# Initial login assets: /css/, /js/, /images/ (real browser observed).
# MFA challenge/methods: exact rules retained; completed challenge NOT_VERIFIED.
# New real direct-runtime enrollment: exact two-factor-enable and
# two-factor-enable-complete GET/POST, followed by consent GET.
# These additions passed syntax/echo-lab and real generic GET checks; enrollment
# through this proxy remains NOT_VERIFIED. Do not activate publicly on that basis.
# Everything else returns 404, except relative bare-prefix 301 redirects (N-1).
#
# Current echo lab: all thirteen publishing rules restrict methods; exact-route
# suffixes remain blocked. Admin/API/account/password/userinfo stay unpublished.
# Host/forwarded-header pinning, query preservation and negative upstream
# reachability are measured separately from provider authentication behavior.
# Evidence: docs/research/MFA_DISPOSABLE_DISCOVERY_20260910.md.
# Historical provider experiments do not establish production verification.
#
# ---------------------------------------------------------------------------
# Finding N-1 (measured 2026-09-10) -- "everything else is 404" has three
# exceptions, and they are not inert
# ---------------------------------------------------------------------------
# nginx redirects an unslashed URI to a prefix location that ends in a slash
# and is handled by proxy_pass. So /css, /js and /images answer **301**, not
# 404, and the Location is assembled from the *client's* Host header plus this
# listener's scheme and port -- `proxy_set_header Host` cannot influence it,
# because the redirect is generated before anything is proxied. Measured:
#
#     GET /css   Host: attacker.example
#     -> 301  Location: http://attacker.example:8080/css/
#
# Remediated in the inactive template (ADR-037): absolute_redirect off keeps
# these nginx-generated redirects relative, without client Host/scheme/port.
# This does not rewrite upstream Location headers or verify hosted UI assets.
# Production remains inactive; historical measurement is retained above.
#
# ---------------------------------------------------------------------------
# Why this file changed (2026-09-09, ADR-034)
# ---------------------------------------------------------------------------
# The previous version allow-listed exactly two paths, the discovery document
# and the JWKS. That is everything a *token verifier* needs and nothing a
# *human login* needs: with only those two paths published, `/oauth2/authorize`
# returns 404 and no browser can ever complete an Authorization Code flow.
# The research pass recorded this as the top finding — the declared runtime
# architecture could not have worked. This file now serves the BFF.
#
# ---------------------------------------------------------------------------
# The passwordChangeRequired tension — read before adding /password
# ---------------------------------------------------------------------------
# Lab-measured (L-3): with MFA required, the login sequence is
#   credentials -> MFA -> [passwordChangeRequired ? change-password] -> token.
# If a user ever carries `passwordChangeRequired = true`, the hosted flow needs
# a change-password page, which lives under /password/* — a prefix ADR-035
# Condition 2 excludes.
#
# The resolution is operational, not a new exception: **JUVAl never sets
# `passwordChangeRequired`.** Password provisioning goes through
# `application/password_provisioning.py`, which sets a compliant password
# directly; there is no JUVAl flow that hands a user a temporary password to
# change at first login. If that ever changes, it needs an ADR, and this file
# needs an exact `location = /password/change` — never a prefix.

server {
    listen 127.0.0.1:8080;
    absolute_redirect off;
    server_tokens off;
    server_name _;

    # The public hostname, set once when the Phase 2 tunnel exists. Kept out of
    # this versioned file because it is not known yet, not because it is
    # secret. Create the include with a single line, e.g.:
    #     set $juval_public_host "idp.example.com";
    include /etc/nginx/juval-fusionauth-host.conf;

    # FusionAuth builds absolute URLs from these. Getting X-Forwarded-Proto
    # wrong produces an issuer with an http:// scheme, which is not acceptable
    # evidence and breaks discovery.
    proxy_http_version 1.1;
    proxy_set_header Host              $juval_public_host;
    proxy_set_header X-Forwarded-Host  $juval_public_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # --- Metadata: read-only, public by necessity ------------------------
    # The backend on Railway resolves signing keys from
    # <issuer>/.well-known/jwks.json (interfaces/api/auth.py) and
    # tools/verify_oidc.py reads the discovery document.

    location = /.well-known/openid-configuration {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    location = /.well-known/jwks.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # --- Authorization endpoint ------------------------------------------
    # GET renders the hosted login page; POST submits credentials to it.
    # Both are the same path: FusionAuth's hosted login form posts back to
    # /oauth2/authorize, and — measured in the 1.69.0 lab — it must carry the
    # original authorization query string, which is why no rewrite happens
    # here and the query is passed through untouched.

    location = /oauth2/authorize {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # --- Token endpoint ---------------------------------------------------
    # Called server-to-server by the BFF on Railway, never by the browser.
    # It is published only because Railway reaches this host through the same
    # public tunnel; if a private path between Railway and juval-server ever
    # exists, this location should be removed rather than kept "just in case".

    location = /oauth2/token {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # --- Logout -----------------------------------------------------------
    # Browser navigation that ends the FusionAuth SSO session. Without it the
    # JUVAl session ends while the IdP session survives and the next login
    # silently re-authenticates (interfaces/api/bff.py::logout).

    location = /oauth2/logout {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # --- Second factor ----------------------------------------------------
    # STATUS: **NOT_VERIFIED — re-measure before Phase 2 activation.**
    #
    # An earlier revision of this file recorded these two routes as MEASURED
    # (200 and 302) on a disposable 1.69.0 instance. The 2026-09-10 recovery
    # audit could not correlate that claim with any recorded evidence: the lab
    # write-up (docs/research/FUSIONAUTH_169_IDENTITY_LAB.md) states the lab was
    # already destroyed, lists neither route in its results, and no probe
    # session survives. The only surviving trace is indirect -- a JVM owned by
    # the working user exited at 16:16:42 UTC, minutes before this file was
    # written -- which is a hint, not evidence.
    #
    # The claim is therefore **withdrawn rather than rewritten**, per the
    # standing rule that an unreproducible measurement is not a measurement.
    # The routes stay in the template because the reasoning below stands on
    # its own; they must be probed on a fresh lab instance, and that result
    # recorded in the research document, before this file is ever enabled.
    #
    # The 2026-09-10 lab confirms only that this proxy dispatches both paths
    # and rejects verbs outside GET/POST. That is a fact about nginx. Whether
    # FusionAuth answers them is the question, and it stays open.
    #
    # The reasoning (unaffected by the withdrawal): the tenant runs
    # multiFactorConfiguration.loginPolicy = Required, so EVERY login passes
    # through the second-factor step. Without a hosted route for it the login
    # flow dead-ends after the password.

    location = /oauth2/two-factor {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    location = /oauth2/two-factor-methods {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # Real disposable JUVAl enrollment reached these exact paths with Required
    # MFA and no pre-attached factor. This supersedes the historical assumption
    # that hosted enrollment is unavailable. See the MFA discovery evidence.
    location = /oauth2/two-factor-enable {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    location = /oauth2/two-factor-enable-complete {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # Observed GET automatically continued to the approved loopback callback.
    # No interactive consent POST was observed or authorized for publication.
    location = /oauth2/consent {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # Registration, passwordless, device and WebAuthn remain unpublished.

    # --- Static theme assets ----------------------------------------------
    # Initial form and direct-runtime enrollment requested these prefixes.
    # No font request or WebAuthn asset requirement was observed in that flow.
    # Full proxy MFA challenge and production compatibility remain unverified.

    location ^~ /css/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    location ^~ /js/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    location ^~ /images/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9011;
    }

    # Known cosmetic consequence, accepted deliberately: the hosted login page
    # renders a "Forgot your password?" link to /password/forgot, which this
    # allow-list leaves at 404. ADR-035 Condition 2 keeps /password/* closed,
    # and JUVAl password resets are an operator procedure
    # (docs/compliance/IDENTITY_ONBOARDING.md), so the link is dead by design.
    # Hiding it is a theme change, not a proxy change.

    # Everything else, including /admin, /api, /account and /password.
    location / {
        return 404;
    }
}
