[project]
name = "juval"
version = "0.1.0"
description = "Juval Amazon Sourcing Decision Engine"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
    # OIDC/JWT verification for interfaces/api/auth.py (ADR-022). Required,
    # not optional: JUVAl must never implement authentication cryptography of
    # its own (CLAUDE.md Sec. 16). The [crypto] extra supplies RS256.
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
