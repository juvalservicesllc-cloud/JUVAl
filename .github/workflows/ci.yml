# JUVAl CI — tests plus the Amazon compliance controls.
#
# The compliance checks run on every push, not on request. Amazon's guidance
# expects scanning after significant change (AC-13A); a control that only runs
# when someone remembers to run it is not a control.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly: dependency advisories change without the code changing, so a
  # green build today says nothing about next month.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          # setuptools ships with the runner image and is audited like any
          # other installed package -- an outdated one fails deps.audit
          # (PYSEC-2026-3447 on setuptools 79.0.1) without JUVAl declaring it.
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Tests
        run: python -m pytest -q

      - name: Compliance checks
        # Incident response plan completeness and review currency (RF-01/RF-05),
        # API auth posture (RF-03/RF-04), dependency CVEs, and secret scanning.
        # Exits non-zero on any FAIL; never prints a matched secret value.
        run: python tools/compliance_check.py

  frontend:
    # The PWA is the primary interface (ADR-014) and its suite, typecheck and
    # build were gates in CLAUDE.md while running nowhere but a developer
    # machine. A gate nobody enforces is not a gate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .node-version is the single pin; do not hardcode a version here.
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: the lockfile decides, so a green build cannot come
      # from a dependency set nobody recorded.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck
      # gate as well as the build gate.
      - name: Build
        run: npm run build
